<style>
  :root { color-scheme: dark; --panel: rgba(6,16,26,.72); --line: rgba(120,160,190,.35); --fg: #b8c7d3; --strong: #e8eff4; --dim: #8fa3b3; --go: #8fd3a2; --warn: #d9b862; --bad: #e58a78;
          --ui: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  html, body { margin: 0; height: 100%; background: #06131f; overflow: hidden; font-family: var(--ui); color: var(--fg); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; pointer-events: none; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  #status { left: 12px; top: 12px; display: grid; grid-template-columns: auto auto; gap: 3px 14px; }
  #status span { font-size: 10px; letter-spacing: .08em; color: var(--dim); align-self: center; }
  #status b { font: 600 15px var(--ui); color: var(--strong); font-variant-numeric: tabular-nums; white-space: nowrap; }
  b.go { color: var(--go) !important; } b.bad { color: var(--bad) !important; } b.warn { color: var(--warn) !important; }
  #msg { left: 50%; top: 44px; transform: translateX(-50%); max-width: min(420px, 44vw); font-size: 15px; color: var(--strong); text-align: center; }
  #flash { left: 0; right: 0; top: 30%; text-align: center; font: 300 52px var(--ui); color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  .inset { border: 1px solid rgba(200,225,240,.55); border-radius: 6px; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
  .inset i { position: absolute; left: 8px; top: 6px; font: 600 10px var(--ui); letter-spacing: .1em; font-style: normal; color: rgba(255,255,255,.9); text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #fight { left: 50%; bottom: 14px; transform: translateX(-50%); width: min(460px, 60vw); text-align: center; }
  #fight .p { font: 600 17px var(--ui); letter-spacing: .03em; margin-bottom: 6px; }
  #fight .row { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .07em; color: var(--dim); margin-bottom: 4px; }
  #fight .row b { color: var(--strong); font-size: 13px; }
  .bar { height: 14px; background: rgba(255,255,255,.09); border: 1px solid rgba(200,220,235,.4); position: relative; }
  .bar::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 15%; background: rgba(224,112,94,.22); }
  .bar div { height: 100%; width: 0; }
  .en { display: inline-block; width: 90px; height: 7px; background: rgba(255,255,255,.12); vertical-align: middle; } .en div { height: 100%; background: #6fa8d0; }
  #fight small { display: block; margin-top: 5px; font-size: 10px; letter-spacing: .08em; color: var(--dim); }
  #card { left: 50%; top: 50%; transform: translate(-50%, -46%); width: min(620px, 86vw); text-align: center; padding: 22px 26px; pointer-events: auto; cursor: pointer; }
  #card.low { top: auto; bottom: 14px; transform: translateX(-50%); padding: 12px 22px; width: min(520px, 80vw); } #card.low h1 { font-size: 28px; margin-bottom: 4px; } #card.low p { font-size: 14px; margin: 2px 0; }
  #card h1 { font: 300 40px var(--ui); margin: 0 0 12px; color: var(--strong); }
  #card p { margin: 4px 0; font-size: 16px; line-height: 1.5; }
  .shop { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); font: 600 10.5px var(--ui); letter-spacing: .08em; color: var(--fg); text-decoration: none;
          background: rgba(6,14,22,.5); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; opacity: .8; white-space: nowrap; }
  .shop:hover { opacity: 1; color: var(--strong); }
  .pad { position: fixed; bottom: 12px; display: none; flex-direction: column; gap: 8px; }
  .touch .pad { display: flex; } #pad-l { left: max(12px, env(safe-area-inset-left, 0px)); } #pad-r { right: max(12px, env(safe-area-inset-right, 0px)); }
  .pad button { font: 600 13px var(--ui); letter-spacing: .04em; color: var(--strong); background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
                width: 88px; min-height: 50px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .pad button.on, .pad button:active { background: rgba(60,90,115,.85); } .pad .go { color: var(--go); } .pad .dart { color: var(--warn); }
  #keys { left: 12px; bottom: 10px; font-size: 11px; letter-spacing: .05em; color: rgba(255,255,255,.7); text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .touch #keys { display: none; } .touch #fight { bottom: 8px; width: min(360px, 44vw); } .touch #status b { font-size: 13px; }
  [hidden] { display: none !important; }
</style>

</head><body>
<canvas id="c"></canvas>
<a class="shop" href="https://www.salttidegear.com" target="_blank" rel="noopener">SALTTIDEGEAR.COM &#8599;</a>
<div class="hud box" id="status"></div>
<div class="hud box" id="msg" hidden></div>
<div class="hud" id="flash" hidden></div>
<div class="hud inset" id="in-tip"><i>ROD TIP</i></div>
<div class="hud inset" id="in-deep"><i id="deep-l">BAIT CAMERA</i></div>
<div class="hud box" id="fight" hidden>
  <div class="p" id="f-p"></div>
  <div class="row"><span>LINE OUT <b id="f-line"></b></span><span>FISH ENERGY <span class="en"><div id="f-en"></div></span></span></div>
  <div class="bar"><div id="f-bar"></div></div><small id="f-s"></small>
</div>
<div class="hud box" id="card"></div>
<div class="hud" id="keys">LEFT / RIGHT = ENGINE LEVER &middot; DOWN = DROP &middot; UP OR SPACE = WIND &middot; F = DART &middot; DRAG = LOOK AROUND</div>
<div class="pad" id="pad-l"><button type="button" id="b-ahead" class="go">AHEAD</button><button type="button" id="b-astern">ASTERN</button></div>
<div class="pad" id="pad-r"><button type="button" id="b-wind" class="go">WIND<br>hold</button><button type="button" id="b-drop">DROP<br>hold</button><button type="button" id="b-dart" class="dart">DART</button></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './GLTFLoader.js';
import { DecalGeometry } from './DecalGeometry.js';

const q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
if (matchMedia('(pointer: coarse)').matches || q.get('touch') === '1') document.documentElement.classList.add('touch');
const TOUCH = document.documentElement.classList.contains('touch');
const M = 0.3048;                                       // metres per foot

// =====================================================================================
//  the fishing itself: the same rules as the flat game, unchanged
// =====================================================================================
const keys = {};
const kWind = () => !!(keys[' '] || keys['arrowup'] || keys['w']);
const kDrop = () => !!(keys['arrowdown'] || keys['s']) && !kWind();
  const W = 1280, H = 720, SURF = 250, FT = 4.15;      // FT = feet per pixel
  const BOATX = 500, TIPX = BOATX + 221;
  const DAY_START = 7 * 60, DAY_END = 17 * 60, CLOCK_RATE = 600 / 480;   // 10 hour day in 8 minutes
  const ZONE_A = TIPX + 115, ZONE_B = TIPX + 220;      // dart zone at the boat
  const KT = 25;                                       // game ft/s per knot
  const UI = '"Segoe UI", Arial, sans-serif', NUM = 'Consolas, "Courier New", monospace';
  const GEAR = [                                       // lever notches -2 .. 5
    { label: 'ASTERN', rpm: 1500, kt: -1.8 }, { label: 'ASTERN IDLE', rpm: 700, kt: -1.0 },
    { label: 'NEUTRAL', rpm: 650, kt: 0 }, { label: 'AHEAD IDLE', rpm: 700, kt: 1.3 },
    { label: 'AHEAD', rpm: 1000, kt: 2.0 }, { label: 'AHEAD', rpm: 1400, kt: 2.9 },
    { label: 'AHEAD', rpm: 1900, kt: 4.0 }, { label: 'AHEAD', rpm: 2600, kt: 5.5 }
  ];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = (a, b) => a + Math.random() * (b - a);

  const freshBoat = cur => ({ wx: 0, v: cur, stw: 0, rpm: 650, notch: 0, wtrPx: 0, cur });
  let state = 'title';            // title, fishing, fight, result, over
  let t = 0, clock = DAY_START, current = 45, boat = freshBoat(45), rig = null, fishes = [], F = null;
  let score = { lbs: 0, count: 0, big: 0, hooked: 0 }, baits = 0, result = null, resultAt = 0, overWhy = '';
  let msg = '', msgUntil = 0, flash = 0, flashText = '';
  let best = 0;
  try { best = +localStorage.getItem('swordfishBest') || 0; } catch (e) {}
  const say = (text, secs) => { msg = text; msgUntil = t + (secs || 4.5); };
  const bottomAt = wx => 1600 + 140 * Math.sin(wx / 1100) + 50 * Math.sin(wx / 310 + 1.3) + 12 * Math.sin(wx / 120);
  const sx = wx => TIPX + (wx - boat.wx) / FT;
  const sy = ft => SURF + ft / FT;

  function spawnFish(dx) {
    return {
      wx: boat.wx + dx, h: rnd(30, 110), vx: rnd(-22, 22),
      wgt: Math.round(60 + 440 * Math.pow(Math.random(), 2.2) + rnd(0, 30)),
      near: 0, delay: rnd(1.5, 4), attempt: 0, phase: rnd(0, 6), dir: 1
    };
  }
  const fishLen = f => 80 + f.wgt * 0.24;
  const fishDepth = f => bottomAt(f.wx) - f.h;

  function newRig() {
    baits--;
    rig = { L: 10, rx: boat.wx, bait: true, tangled: false, lost: false, tangle: 0, botT: 0, rigT: 0, bite: null,
            windAcc: 0, dropAcc: 0, quiet: 0, hinted: false, d: 10, off: 0, angle: 0, onBottom: false, bot: bottomAt(boat.wx) };
  }

  function newGame() {
    clock = DAY_START; current = rnd(35, 58);
    boat = freshBoat(current);
    baits = 6; score = { lbs: 0, count: 0, big: 0, hooked: 0 };
    newRig();
    fishes = [];
    for (let i = 0; i < 3; i++) fishes.push(spawnFish(rnd(900, 3600) * (Math.random() < 0.8 ? 1 : -1)));
    state = 'fishing';
    say('Engine in neutral, drifting. Hold Down to drop; pause now and then so the leader does not wrap.', 9);
  }

  function endDay(why) {
    overWhy = why; state = 'over'; resultAt = t;
    if (score.lbs > best) { best = score.lbs; try { localStorage.setItem('swordfishBest', best); } catch (e) {} }
  }

  function advance() {
    if (state === 'title') newGame();
    else if (state === 'result' && t - resultAt > 0.7) {
      if (clock >= DAY_END) endDay("Five o'clock. Lines up.");
      else if (baits <= 0) endDay('Out of bait.');
      else { state = 'fishing'; rig.L = 10; rig.bait = false; rig.bite = null; rig.rigT = 2.5; say('Rigging a fresh bait...', 2.5); }
    } else if (state === 'over' && t - resultAt > 0.7) newGame();
  }

  // ---------- boat ----------
  // The bow points left, into the current. Speed over ground = current - speed through the water.
  function updateBoat(dt) {
    const g = GEAR[boat.notch + 2];
    boat.rpm += (g.rpm - boat.rpm) * Math.min(1, 2.5 * dt);
    boat.stw += (g.kt * KT - boat.stw) * Math.min(1, 0.7 * dt);
    boat.cur = current + 8 * Math.sin(t / 37) + 4 * Math.sin(t / 11);
    boat.v = boat.cur - boat.stw;
    boat.wx += boat.v * dt;
    boat.wtrPx += boat.stw * dt / FT;
  }

  // ---------- fishing: rig, bite ----------
  function rigGeometry() {
    let off = rig.rx - boat.wx;
    if (Math.abs(off) > rig.L) { rig.rx = boat.wx + Math.sign(off) * rig.L; off = rig.rx - boat.wx; }
    const vert = Math.sqrt(Math.max(0, rig.L * rig.L - off * off));
    rig.bot = bottomAt(rig.rx);
    rig.onBottom = vert >= rig.bot;
    rig.d = Math.min(vert, rig.bot);
    rig.off = off;
    rig.angle = Math.asin(clamp(Math.abs(off) / Math.max(1, rig.L), 0, 1)) * 180 / Math.PI;
  }

  function fishLeaves(f) { const i = fishes.indexOf(f); if (i >= 0) fishes.splice(i, 1); }

  function updateFishing(dt) {
    clock += dt * CLOCK_RATE;
    updateBoat(dt);
    const wind = kWind(), drop = kDrop();
    if (rig.rigT > 0) {
      rig.rx = boat.wx; rigGeometry();
      rig.rigT -= dt;
      if (rig.rigT <= 0) { newRig(); say('Fresh squid on the hook. Drop it.', 3); }
    } else {
      if (drop) {
        rig.L = Math.min(2400, rig.L + 140 * dt);
        if (rig.L > 150 && !rig.onBottom && !rig.tangled) rig.tangle += dt / 4.5;
      } else rig.tangle = rig.tangled ? 1 : Math.max(0, rig.tangle - dt / 1.2);
      if (wind) rig.L = Math.max(10, rig.L - 125 * dt);
      if (rig.tangle >= 1 && !rig.tangled && rig.bait) {
        rig.tangled = true; rig.tangle = 1;
        say('Dropped too fast: the leader wrapped the main line. Wind up and re-rig.', 6);
      }
      const k = 0.12 + 0.9 * Math.max(0, 1 - rig.L / 800);
      rig.rx += (boat.wx - rig.rx) * Math.min(1, k * dt);
      rigGeometry();

      if (rig.onBottom && !rig.lost && rig.L > 200) {
        rig.botT += dt;
        if (rig.botT > 5) { rig.lost = true; rig.bait = false; rig.bite = null; say('Hung the bottom and broke off. Wind up and re-rig.', 6); }
      } else rig.botT = Math.max(0, rig.botT - dt * 2);

      if (rig.L <= 12 && (!rig.bait || rig.tangled || rig.lost)) {
        if (baits > 0) { rig.rigT = 2.5; say('Rigging a fresh bait...', 2.5); }
        else { endDay('Out of bait.'); return; }
      }
      updateBite(dt, wind, drop);
    }
    updateFish(dt);
    if (clock >= DAY_END && state === 'fishing') endDay("Five o'clock. Lines up.");
  }

  function updateFish(dt) {
    const usable = rig.bait && !rig.tangled && !rig.lost && !rig.onBottom && rig.rigT <= 0;
    const hb = rig.bot - rig.d;                               // bait height off bottom
    for (const f of fishes.slice()) {
      const dx = rig.rx - f.wx;
      const engaged = rig.bite && rig.bite.fish === f;
      if ((usable && hb > 15 && hb < 170 && Math.abs(dx) < 950) || engaged) {
        if (Math.abs(dx) > 12) { f.dir = Math.sign(dx); f.wx += f.dir * 28 * dt; }
        f.h += clamp(clamp(hb, 20, 150) - f.h, -20 * dt, 20 * dt);
      } else {
        f.wx += f.vx * dt; f.dir = f.vx >= 0 ? 1 : -1;
      }
      const dist = Math.hypot(f.wx - rig.rx, fishDepth(f) - rig.d);
      if (usable && !rig.bite && dist < 130) {
        f.near += dt;
        if (f.near >= f.delay) {
          rig.bite = { type: ['tap', 'tap', 'heavy', 'slack'][Math.floor(Math.random() * 4)], t0: t, fish: f, phase: 'show' };
          rig.windAcc = 0;
        }
      }
      if (Math.abs(f.wx - boat.wx) > 4600 && !engaged) fishLeaves(f);
    }
    while (fishes.length < 3) {
      const ahead = boat.v >= 0 ? 1 : -1;
      fishes.push(spawnFish(rnd(1300, 3200) * (Math.random() < (Math.abs(boat.v) < 12 ? 0.5 : 0.8) ? ahead : -ahead)));
    }
  }

  function updateBite(dt, wind, drop) {
    if (!rig.bait && !rig.lost && !rig.tangled) {
      rig.quiet += dt;
      if (rig.quiet > 12 && !rig.hinted) { rig.hinted = true; say('The tip looks light. The bait may be gone: wind up and check.', 6); }
    }
    const b = rig.bite;
    if (!b) return;
    const f = b.fish;
    if (b.phase === 'show') {
      if (wind) rig.windAcc += dt;
      if (rig.windAcc >= 1.0) {
        const p = 0.45 + 0.15 * f.attempt - (rig.angle > 30 ? 0.2 : 0);
        if (Math.random() < p) { startFight(f); return; }
        b.phase = 'missed'; b.t0 = t; rig.dropAcc = 0;
        say('Came tight for a second, then nothing. Drop it back to him (hold Down).', 5);
      } else if (t - b.t0 > 3.4 && !wind) {
        f.attempt++; f.near = 0; f.delay = rnd(3, 6); rig.bite = null;
        if (Math.random() < 0.5) { rig.bait = false; rig.quiet = 0; }
        say('Something tapped the bait and you missed it. Watch the rod tip.', 5);
        if (f.attempt >= 3 || !rig.bait) fishLeaves(f);
      }
    } else {                                                  // missed: waiting for the drop-back
      if (drop) rig.dropAcc += dt;
      if (rig.dropAcc >= 0.8) {
        f.attempt++; f.near = 0; f.delay = rnd(0.8, 2.6); rig.bite = null;
        if (f.attempt >= 4) { fishLeaves(f); rig.bait = false; rig.quiet = 0; }
      } else if (t - b.t0 > 6) {
        rig.bite = null; fishLeaves(f);
        if (Math.random() < 0.5) { rig.bait = false; rig.quiet = 0; }
        say('He lost interest.', 3);
      }
    }
  }

  // how loaded the rod tip is, 0 = straight, 1 = bent hard
  function tipLoad() {
    if (state === 'fight') return 0.25 + F.tension / 100 * 0.95;
    if (state === 'result') return 0.2;
    if (!rig || rig.rigT > 0 || rig.L < 40) return 0.15;
    let v = rig.onBottom ? 0.12 : rig.lost ? 0.2 : rig.bait ? 0.6 : 0.52;
    v += 0.05 * Math.sin(t * 1.7);
    if (kWind()) v += 0.25;
    if (kDrop() && !rig.onBottom) v -= 0.3;
    const b = rig.bite;
    if (b && b.phase === 'show') {
      const u = t - b.t0, amp = rig.angle > 30 ? 0.45 : 1;
      if (b.type === 'tap') {
        for (const p of [0.15, 0.42, 1.0, 1.25, 2.1]) { const q = u - p; if (q > 0 && q < 0.16) v += amp * 0.28 * Math.sin(q / 0.16 * Math.PI); }
      } else if (b.type === 'heavy') { if (u < 2.6) v += amp * 0.3 * Math.min(1, u / 0.5); }
      else if (u < 2.4) v -= amp * 0.38 * Math.min(1, u / 0.25);
    }
    return clamp(v, 0, 1.3);
  }

  // ---------- fight ----------
  function startFight(f) {
    fishLeaves(f);
    rig.bait = false; rig.bite = null;
    F = { f, depth: rig.d, line: Math.max(rig.L, rig.d), stam: 1, mode: Math.random() < 0.5 ? 'rise' : 'run', timer: 2.2,
          tension: 45, slack: 0, time: 0, clock0: clock, x: TIPX + rig.off / FT, y: sy(rig.d), strength: 0.7 + f.wgt / 500, boatT: 0, jumpT: 0, darts: 0 };
    state = 'fight'; score.hooked++;
    flash = 1.6; flashText = 'HOOKED UP';
    say('The weight broke away. Stay tight to him.', 4);
  }

  function endFight(landed, text, sub) {
    if (landed) { score.lbs += F.f.wgt; score.count++; score.big = Math.max(score.big, F.f.wgt); }
    result = { landed, text, sub, wgt: F.f.wgt, mins: Math.max(5, Math.round((clock - F.clock0) / 5) * 5) };
    state = 'result'; resultAt = t;
  }

  function nextMode() {
    if (F.mode !== 'dog') { F.mode = 'dog'; F.timer = rnd(1.6, 3.2) * (1.25 - 0.6 * F.stam); return; }
    const opts = [['run', 0.45]];
    if (F.depth > 350) opts.push(['rise', 0.33]);
    if (F.depth < 260) opts.push(['jump', 0.3]);
    let r = Math.random() * opts.reduce((s, o) => s + o[1], 0);
    for (const o of opts) { r -= o[1]; if (r <= 0) { F.mode = o[0]; break; } }
    F.timer = F.mode === 'run' ? rnd(1.2, 3) * (0.45 + F.stam) : F.mode === 'rise' ? rnd(1.5, 3) : 1.3;
    F.jumpT = 0;
  }

  function dart() {
    if (state !== 'fight' || F.mode !== 'boat' || F.boatT < 0.4) return;
    if (F.x >= ZONE_A && F.x <= ZONE_B) { endFight(true, 'On the deck', ''); return; }
    F.darts++; F.mode = 'run'; F.timer = 1.8; F.stam = Math.min(1, F.stam + 0.12);
    say('Missed with the dart. He is off again.', 3.5);
  }

  function updateFight(dt) {
    clock += dt * CLOCK_RATE * 1.5;
    updateBoat(dt);
    const w = kWind(), f = F.f;
    F.time += dt;

    if (F.mode === 'boat') {
      F.boatT += dt;
      F.x = TIPX + 95 + Math.sin(F.boatT * (1.3 + f.wgt / 900)) * 190;
      F.y = SURF + 46 + Math.sin(F.boatT * 2.3) * 6;
      F.tension += (50 - F.tension) * Math.min(1, 3 * dt);
      if (F.boatT > 9) { F.mode = 'run'; F.timer = 2; say('He got his second wind.', 3); }
      return;
    }

    F.timer -= dt;
    if (F.timer <= 0) nextMode();

    if (F.mode === 'run') { F.depth = Math.min(1900, F.depth + (60 + f.wgt * 0.1) * (0.4 + F.stam) * dt); F.stam -= 0.07 * dt; }
    else if (F.mode === 'rise') { F.depth = Math.max(80, F.depth - 140 * dt); F.stam -= 0.03 * dt; if (F.depth <= 80) F.timer = 0; }
    else if (F.mode === 'jump') { F.jumpT += dt; F.stam -= 0.1 * dt; }
    if (F.depth > F.line) F.line = F.depth;                   // the drag gives line
    let slack = F.line - F.depth;
    if (w && slack > 0) { F.line -= Math.min(slack, 210 * dt); slack = F.line - F.depth; }
    const taut = slack < 20;

    if (!taut) F.tension -= 50 * dt;
    else if (F.mode === 'run') { if (w) F.tension += 52 * F.strength * dt; else F.tension += (45 - F.tension) * Math.min(1, 3 * dt); }
    else if (F.mode === 'jump') { if (w) F.tension += 90 * F.strength * dt; else F.tension += (25 - F.tension) * Math.min(1, 3 * dt); }
    else if (F.mode === 'rise') F.tension += ((w ? 40 : 30) - F.tension) * Math.min(1, 3 * dt);
    else if (w) {                                             // dog: pump and wind
      F.tension += (60 - F.tension) * Math.min(1, 3 * dt);
      F.depth = Math.max(0, F.depth - 42 * (1.3 - 0.5 * F.stam) * dt); F.line = F.depth + slack; F.stam -= 0.03 * dt;
    } else F.tension += (30 - F.tension) * Math.min(1, 1.5 * dt);
    F.stam = Math.max(0.15, F.stam);
    F.tension = Math.max(0, F.tension);

    floor.visible = true; snow3.visible = true; updateFloor(target.z);
    const floorY = -bottomAt(boat.wx - target.z / M) * M;
    if (fighting) { const r = 6 + fishMetres(F.f.wgt) * 1.6; deepCam.position.set(target.x + r * 0.75, jumpy ? 1.6 : target.y + 0.8, target.z + r * 0.66); }
    else deepCam.position.set(target.x + 4.6, target.y - 0.6, target.z + 4.2);
    if (!jumpy) deepCam.position.y = Math.max(deepCam.position.y, floorY + 1.2);
    deepCam.lookAt(target.x + (fighting ? 0 : 0.4), target.y - (fighting ? 0 : 1.3), target.z);
    if (atBoat) { const zc = -2.6 + (ZS_A + ZS_B) / 2 * 6; deepCam.position.set(FIGHT_X + 4.6 + fishMetres(F.f.wgt) * 0.8, target.y + 0.4, zc - 0.6); deepCam.lookAt(FIGHT_X, target.y + 0.15, zc - 0.6); }   // broadside: he swims across the picture, through the zone
    if (deepCam.position.y > 0) setAir(); else setWater(-deepCam.position.y);
    camLight.position.copy(deepCam.position);
    const sp = snowGeo.attributes.position;
    for (let i = 0; i < SNOW_N; i++) { let y = sp.getY(i) - lastDt * 0.12; if (y < -15) y += 30; sp.setY(i, y); } sp.needsUpdate = true; snow3.position.copy(deepCam.position);
    view(deepCam, insetDeep);
    $('deep-l').textContent = (fighting ? 'FISH CAMERA' : rigUp ? 'BAIT CAMERA' : 'RIGGING') + ' · ' + Math.round(deepDepthFt) + ' FT';
  }
  renderer.setScissorTest(false);
  updateHud();
}

let last = performance.now(), lastDt = 0.016;
function frame(now) {
  lastDt = Math.min(0.05, Math.max(0.001, (now - last) / 1000)); last = now;
  const speed = +(q.get('speed') || 1);
  for (let i = 0; i < speed; i++) update(lastDt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
